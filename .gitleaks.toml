title = "fwconfigsanitizer gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

# MEC-13: commit 7458b76 (the original H3a fixture-suite commit, added in
# PR #4) labelled case 88's synthetic PEM fixture with a bare "-----BEGIN
# OPENSSH PRIVATE KEY-----" description line. That redundant header text
# (not the fixture's actual body, which is the literal string
# "FAKEKEYDATA88" -- no real key material) is what the default
# `private-key` rule matched on test/cases.js:680. The description was
# relabelled in a later commit so the fixture no longer trips the rule at
# all, but gitleaks scans full PR history (fetch-depth: 0), so the original
# commit's now-superseded finding still needs an explicit exception. This
# exception is pinned to that one rule, that one commit, and that one path
# (AND semantics) -- it does not exempt test/cases.js from any other rule.
[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "MEC-13 synthetic PEM-header label in 7458b76 (case 88), relabelled in a later commit"
condition = "AND"
commits = ["7458b76ec9da82cdd4d13298a71376d2b8d19b52"]
paths = ['''^test/cases\.js$''']
# case 88's fixture body (mecmcp#392 dropped the redundant custom
# pem-private-key rule since the default private-key rule already covers
# all key types, so this exception -- formerly under pem-private-key --
# now lives directly under private-key).
[[rules.allowlists]]
description = "synthetic case-88 PEM header (body is literal FAKEKEYDATA88)"
condition = "AND"
paths = ['''^test/cases\.js$''']
regexTarget = "line"
regexes = ['''FAKEKEYDATA88''']
# MEC-18 round-3 finding 3 extended case 115 with a second, legacy-encrypted
# PEM block (Proc-Type/DEK-Info headers) to reproduce the round-3 review's
# fail-open scenario. Body content on the surrounding lines is literal
# FAKE115* placeholder text, no real key material.
[[rules.allowlists]]
description = "MEC-18 round-3 finding 3: synthetic second PEM block in case 115"
condition = "AND"
paths = ['''^test/cases\.js$''']
regexTarget = "line"
regexes = ['''FAKE115''']
# MEC-731 re-review NEW-1: case 119 adds synthetic CRLF/trailing-space/
# same-line BEGIN-marker PEM fixtures to reproduce the fail-open regression
# fixed in this PR. Body content is literal FAKE119* placeholder text, no
# real key material.
[[rules.allowlists]]
description = "MEC-731 re-review NEW-1: synthetic CRLF/trailing-space/same-line PEM fixtures in case 119"
condition = "AND"
paths = ['''^test/cases\.js$''']
regexTarget = "line"
regexes = ['''FAKE119''']

# The vendor rule below is not in gitleaks' default ruleset, so PR #4's
# test fixtures were never checked against it and it fires on a synthetic
# value in test/cases.js. The allowlist is scoped to the exact fixture
# text, not the whole file -- a real secret added to test/cases.js in a
# later commit still alerts.
[[rules]]
id = "junos-type9-secret"
[[rules.allowlists]]
description = "synthetic $9$FAKE* fixtures in the sanitizer test suite and its generated reports (MEC-316)"
condition = "AND"
paths = ['''^test/cases\.js$''', '''^test/reports/''']
regexTarget = "match"
regexes = ['''^\$9\$FAKE[A-Za-z0-9]*$''']

# MEC-141 re-review F1: mecmcp#392 dropped the custom pem-private-key rule
# on the assumption that the default private-key rule already covers all
# key types. That is only true for complete PEM blocks -- the default rule
# requires a full header, a >=64-char body, and the closing footer, so it
# misses truncated/partial PEM (exactly the shape this repo's fixture suite
# produces, e.g. cases 115 and 119). This repo-local rule restores
# header-only detection so partial keys still alert.
[[rules]]
id = "pem-private-key-header"
description = "PEM private key header (catches truncated/partial blocks)"
regex = '''-----BEGIN\s+((EC|RSA|DSA|OPENSSH|ENCRYPTED)\s+)?PRIVATE KEY-----|-----BEGIN PGP PRIVATE KEY BLOCK-----'''
tags = ["pem", "secret"]
[[rules.allowlists]]
description = "synthetic PEM fixtures in test/cases.js (FAKEKEYDATA88 / FAKE115* / FAKE119*)"
condition = "AND"
paths = ['''^test/cases\.js$''']
regexTarget = "line"
regexes = ['''FAKEKEYDATA88''', '''FAKE115''', '''FAKE119''']
[[rules.allowlists]]
description = "MEC-13 pre-relabel description line in 7458b76"
condition = "AND"
commits = ["7458b76ec9da82cdd4d13298a71376d2b8d19b52"]
paths = ['''^test/cases\.js$''']
